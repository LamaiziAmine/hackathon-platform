spring.application.name=api-gateway
server.port=8080

# Adresse d'Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Route pour Identity Service
spring.cloud.gateway.routes[0].id=identity-service
spring.cloud.gateway.routes[0].uri=lb://IDENTITY-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# Route pour Hackathon Service
spring.cloud.gateway.routes[1].id=hackathon-service
spring.cloud.gateway.routes[1].uri=lb://HACKATHON-SERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/hackathons/**
spring.cloud.gateway.routes[1].filters[0]=AuthenticationFilter

# Route pour Application Service
spring.cloud.gateway.routes[2].id=application-service
spring.cloud.gateway.routes[2].uri=lb://APPLICATION-SERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/applications/**
spring.cloud.gateway.routes[2].filters[0]=AuthenticationFilter

# Route pour Participant Service
spring.cloud.gateway.routes[3].id=participant-service
spring.cloud.gateway.routes[3].uri=lb://PARTICIPANT-SERVICE
spring.cloud.gateway.routes[3].predicates[0]=Path=/participants/**
spring.cloud.gateway.routes[3].filters[0]=AuthenticationFilter

spring.cloud.gateway.routes[4].id=team-service
spring.cloud.gateway.routes[4].uri=lb://TEAM-SERVICE
spring.cloud.gateway.routes[4].predicates[0]=Path=/teams/**
spring.cloud.gateway.routes[4].filters[0]=AuthenticationFilter

spring.cloud.gateway.routes[5].id=deliverable-service
spring.cloud.gateway.routes[5].uri=lb://DELIVERABLE-SERVICE
spring.cloud.gateway.routes[5].predicates[0]=Path=/deliverables/**
spring.cloud.gateway.routes[5].filters[0]=AuthenticationFilter

# Configuration CORS (Pour Frontend React)
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*


